[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chameloon-space"
version = "0.1.0"
description = "Server SDK for Chameloon spaces: serve space folders, sync, device auth and bots."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]
keywords = ["chameloon", "sync", "wsgi", "asgi"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://chameloon.com"
Documentation = "https://chameloon.com/docs/"

[project.scripts]
chameloon-serve-py = "chameloon_space.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["chameloon_space"]

[tool.pytest.ini_options]
testpaths = ["tests"]
